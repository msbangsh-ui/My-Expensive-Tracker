<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>My Expense Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px}
.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
h1,h2,h3{margin:0 0 12px}.muted{color:#6b7280;font-size:14px}
.auth{max-width:430px;margin:8vh auto}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
.primary{background:#111827;color:#fff;width:100%;margin-top:12px}.secondary{background:#e5e7eb}
.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;border-radius:16px;background:#fff;border:1px solid #e5e7eb}
.stat b{display:block;font-size:22px;margin-top:4px}.green{color:#15803d}.red{color:#b91c1c}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:8px 11px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #eee;padding:12px 0}
.item:first-child{border-top:0}.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#e5e7eb}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.msg{padding:10px;border-radius:10px;margin:10px 0;font-size:14px}
@media(max-width:650px){.row,.formgrid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="authView" class="wrap auth">
  <div class="card">
    <h1>My Expense Tracker</h1>
    <p class="muted">Cloud version — same data on both mobiles.</p>
    <div id="authMsg"></div>
    <label>Email</label><input id="email" type="email" autocomplete="email" placeholder="Email">
    <label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <label id="nameLabel">Name (for new account)</label><input id="name" autocomplete="name" placeholder="Name">
    <button id="loginBtn" class="primary">Login</button>
    <button id="signupBtn" class="secondary" style="width:100%;margin-top:8px">Create account</button>
  </div>
</div>

<div id="appView" class="wrap hidden">
  <div class="top card">
    <div><h2>My Expense Tracker</h2><div id="userInfo" class="muted"></div></div>
    <button id="logoutBtn" class="secondary">Logout</button>
  </div>

  <div class="row">
    <div class="stat"><span class="muted">Today Expense</span><b class="red" id="todayExpense">0</b></div>
    <div class="stat"><span class="muted">Today Income</span><b class="green" id="todayIncome">0</b></div>
    <div class="stat"><span class="muted">Balance</span><b id="todayBalance">0</b></div>
  </div>

  <div class="card">
    <h3 id="formTitle">Add Entry</h3>
    <input id="editId" type="hidden">
    <div class="formgrid">
      <div><label>Type</label><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></div>
      <div><label>Amount</label><input id="amount" type="number" min="0" step="0.01" placeholder="0"></div>
      <div><label>Category</label><select id="category">
        <option>Food</option><option>Petrol</option><option>Shopping</option><option>Bills</option><option>Business</option><option>Medicine</option><option>Transport</option><option>Salary</option><option>Other</option>
      </select></div>
      <div><label>Date</label><input id="date" type="date"></div>
      <div style="grid-column:1/-1"><label>Description</label><input id="description" placeholder="Description"></div>
    </div>
    <div class="actions">
      <button id="saveBtn" class="primary" style="width:auto">Save Entry</button>
      <button id="cancelBtn" class="secondary hidden">Cancel Edit</button>
    </div>
    <div id="appMsg"></div>
  </div>

  <div class="card">
    <div class="top"><h3>All Entries</h3><button id="refreshBtn" class="secondary">Refresh</button></div>
    <div class="formgrid">
      <div><label>Filter Date</label><input id="filterDate" type="date"></div>
      <div><label>Category</label><select id="filterCategory"><option value="">All</option><option>Food</option><option>Petrol</option><option>Shopping</option><option>Bills</option><option>Business</option><option>Medicine</option><option>Transport</option><option>Salary</option><option>Other</option></select></div>
    </div>
    <div id="entries" style="margin-top:10px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://oknctubnisafnvigjokn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Hw0vG7zsf14AY4JsEVfHhA_dmSaa1PP';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const money = n => Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => new Date().toISOString().slice(0,10);
let currentUser = null, profile = null, allEntries = [];

$("date").value = today();

function msg(el, text, type="") {
  el.innerHTML = text ? `<div class="msg ${type}">${text}</div>` : "";
}

async function loadProfile() {
  const {data,error} = await sb.from("profiles").select("id,full_name,role").eq("id",currentUser.id).single();
  if(error) throw error;
  profile = data;
  $("userInfo").textContent = `${profile.full_name || currentUser.email} • ${profile.role.toUpperCase()}`;
}

async function loadEntries() {
  const {data,error} = await sb.from("expenses").select("*").order("date",{ascending:false}).order("created_at",{ascending:false});
  if(error) throw error;
  allEntries = data || [];
  render();
}

function render() {
  const fd = $("filterDate").value, fc = $("filterCategory").value;
  const filtered = allEntries.filter(x => (!fd || x.date===fd) && (!fc || x.category===fc));
  let te=0, ti=0;
  allEntries.filter(x=>x.date===today()).forEach(x => x.type==="expense" ? te+=Number(x.amount) : ti+=Number(x.amount));
  $("todayExpense").textContent = money(te);
  $("todayIncome").textContent = money(ti);
  $("todayBalance").textContent = money(ti-te);

  if(!filtered.length) {
    $("entries").innerHTML = '<p class="muted">No entries found.</p>'; return;
  }
  $("entries").innerHTML = filtered.map(x => {
    const mine = x.user_id === currentUser.id;
    const canEdit = mine || profile.role==="admin";
    const canDelete = canEdit;
    return `<div class="item">
      <div>
        <b class="${x.type==="expense"?"red":"green"}">${x.type==="expense"?"−":"+"} ${money(x.amount)}</b>
        <span class="badge">${x.category}</span>
        <div>${escapeHtml(x.description||"")}</div>
        <div class="muted">${x.date} • ${mine?"You":(profile.role==="admin"?"Other user":"Other user")}</div>
      </div>
      <div class="actions">
        ${canEdit?`<button class="secondary" onclick="editEntry('${x.id}')">Edit</button>`:""}
        ${canDelete?`<button class="danger" onclick="deleteEntry('${x.id}')">Delete</button>`:""}
      </div>
    </div>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function saveEntry() {
  const amount=Number($("amount").value), id=$("editId").value;
  if(!amount || amount<0) { msg($("appMsg"),"Amount enter karein.","danger"); return; }
  const payload={type:$("type").value,amount,category:$("category").value,date:$("date").value,description:$("description").value.trim()};
  let res;
  if(id) res=await sb.from("expenses").update(payload).eq("id",id);
  else res=await sb.from("expenses").insert({...payload,user_id:currentUser.id});
  if(res.error) { msg($("appMsg"),res.error.message,"danger"); return; }
  msg($("appMsg"),"Saved successfully.","success");
  clearForm(); await loadEntries();
}

window.editEntry = function(id) {
  const x=allEntries.find(e=>String(e.id)===String(id)); if(!x) return;
  $("editId").value=x.id; $("type").value=x.type; $("amount").value=x.amount; $("category").value=x.category; $("date").value=x.date; $("description").value=x.description||"";
  $("formTitle").textContent="Edit Entry"; $("cancelBtn").classList.remove("hidden"); window.scrollTo({top:0,behavior:"smooth"});
};
window.deleteEntry = async function(id) {
  if(!confirm("Delete this entry?")) return;
  const {error}=await sb.from("expenses").delete().eq("id",id);
  if(error) { msg($("appMsg"),error.message,"danger"); return; }
  await loadEntries();
};

function clearForm() {
  $("editId").value=""; $("type").value="expense"; $("amount").value=""; $("category").value="Food"; $("date").value=today(); $("description").value="";
  $("formTitle").textContent="Add Entry"; $("cancelBtn").classList.add("hidden");
}

async function enterApp() {
  const {data}=await sb.auth.getUser();
  currentUser=data.user;
  if(!currentUser) return showAuth();
  try { await loadProfile(); await loadEntries(); $("authView").classList.add("hidden"); $("appView").classList.remove("hidden"); }
  catch(e) { msg($("authMsg"),e.message,"danger"); }
}
function showAuth() { $("authView").classList.remove("hidden"); $("appView").classList.add("hidden"); }

$("loginBtn").onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error) msg($("authMsg"),error.message,"danger"); else enterApp();
};
$("signupBtn").onclick=async()=>{
  const {data,error}=await sb.auth.signUp({email:$("email").value.trim(),password:$("password").value,options:{data:{full_name:$("name").value.trim()}}});
  if(error) {msg($("authMsg"),error.message,"danger");return;}
  if(data.session) enterApp(); else msg($("authMsg"),"Account ban gaya. Agar email confirmation on hai to email confirm karke Login karein.","success");
};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut(); currentUser=null; profile=null; showAuth();};
$("saveBtn").onclick=saveEntry;
$("cancelBtn").onclick=clearForm;
$("refreshBtn").onclick=loadEntries;
$("filterDate").onchange=render;
$("filterCategory").onchange=render;
sb.auth.onAuthStateChange((_event,session)=>{ if(session && !currentUser) enterApp(); });
enterApp();
</script>
</body>
</html>
